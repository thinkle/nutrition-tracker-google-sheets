name = "personal-mcp"
main = "src/index.js"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]

# Service Bindings — call the proxy workers directly without going through HTTP routing.
# This avoids the Cloudflare 1042 error that occurs when Workers fetch other workers.dev URLs.
[[services]]
binding = "NUTRITION"
service = "nutrition"

[[services]]
binding = "XERT"
service = "xert"

[[services]]
binding = "SPEEDIANCE"
service = "speediance"

[[services]]
binding = "STRAVA_SYNC"
service = "strava-nutrition-sync"

[vars]
RECIPE_API_BASE = "https://dev--gourmet-svelte.netlify.app/.netlify/functions/api"

# Secrets — set these via CLI, do NOT put values here:
#   wrangler secret put MCP_API_KEY      (Bearer token Claude sends to connect)
#   wrangler secret put XERT_API_KEY     (X-API-KEY for xert.tmhinkle.workers.dev)
#   wrangler secret put RECIPE_API_KEY   (X-API-Key for the recipe tracker)
#   wrangler secret put USDA_API_KEY        (API key from https://fdc.nal.usda.gov/api-key)
#   wrangler secret put SPEEDIANCE_API_KEY  (X-API-KEY for speediance.tmhinkle.workers.dev — must match that worker's API_KEY secret)
#   wrangler secret put STRAVA_SYNC_API_KEY (X-API-KEY for strava-nutrition-sync.tmhinkle.workers.dev)
