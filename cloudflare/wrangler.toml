name = "nutrition-xert-proxy"
main = "CloudflareXertProxy.js"
compatibility_date = "2024-09-01"
workers_dev = true

# Bindings
# Replace the id with your KV namespace id after creating it:
#   npx wrangler kv namespace create SECRET_STORE
# Then paste the returned id below.
kv_namespaces = [
  { binding = "SECRET_STORE", id = "YOUR_KV_NAMESPACE_ID" }
]

# Do NOT store secrets in this file. Set them via `wrangler secret put` instead.
# Required secrets:
# - API_KEY
# - XERT_USERNAME
# - XERT_PASSWORD
